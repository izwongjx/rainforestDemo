<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f6" />
      <stop offset="100%" stop-color="#e5e0d8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#faf9f6" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Decorative Background Grid Lines -->
  <path d="M0 150 L800 150 M0 300 L800 300 M0 450 L800 450 M200 0 L200 600 M400 0 L400 600 M600 0 L600 600" stroke="#8c6239" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Center Card Frame -->
  <rect x="200" y="150" width="400" height="300" rx="16" fill="url(#cardGrad)" stroke="#8c6239" stroke-dasharray="0" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Hotel Bed Icon -->
  <g transform="translate(360, 230)" fill="none" stroke="#2d3e32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 30 V5 M2 18 H78 M78 30 V12 M14 18 V12 A6 6 0 0 1 26 12 V18 M54 18 V12 A6 6 0 0 1 66 12 V18" />
    <path d="M2 24 H78 A4 4 0 0 1 82 28 V30 H-2 V28 A4 4 0 0 1 2 24 Z" fill="#2d3e32" fill-opacity="0.1" />
  </g>
  
  <!-- Text Label -->
  <text x="400" y="345" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="22" font-weight="600" fill="#2d3e32" letter-spacing="-0.5">
    Room Photos Coming Soon
  </text>

  <text x="400" y="375" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#8c6239" letter-spacing="1.5" text-transform="uppercase">
    Rain Forest Hotel • Chinatown KL
  </text>
  
  <!-- Corner Accents -->
  <path d="M 220 180 L 220 170 L 230 170" fill="none" stroke="#8c6239" stroke-width="2" stroke-linecap="round"/>
  <path d="M 580 180 L 580 170 L 570 170" fill="none" stroke="#8c6239" stroke-width="2" stroke-linecap="round"/>
  <path d="M 220 420 L 220 430 L 230 430" fill="none" stroke="#8c6239" stroke-width="2" stroke-linecap="round"/>
  <path d="M 580 420 L 580 430 L 570 430" fill="none" stroke="#8c6239" stroke-width="2" stroke-linecap="round"/>
</svg>
